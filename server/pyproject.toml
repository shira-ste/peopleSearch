[project]
name = "people-server"
version = "0.1.0"
description = "MCP server that answers questions about people records (Streamable HTTP on /mcp)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
people-server = "people_server.__main__:main"
people-ingest = "people_server.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
