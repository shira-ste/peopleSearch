server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://chat:8001;
        proxy_http_version 1.1;
        proxy_buffering off;          # pass streamed answers through as they arrive
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
