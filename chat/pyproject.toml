[project]
name = "people-chat"
version = "0.1.0"
description = "Chat backend: Claude answers questions by calling the people MCP server's tools."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.6",
    "httpx2>=2.0.0",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
people-chat = "people_chat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
