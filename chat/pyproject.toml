[project]
name = "chat"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.6",
    "mcp[cli]>=2.3.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "../server"
strict = true

[tool.pytest.ini_options]
pythonpath = [".", "../server"]
markers = ["e2e: calls the real Claude API (costs money); run with RUN_E2E=1"]
