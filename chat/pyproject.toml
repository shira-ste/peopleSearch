[project]
name = "chat"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.6",
    "google-genai>=3.3.0",
    "mcp[cli]>=2.3.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
