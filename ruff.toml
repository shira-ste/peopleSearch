line-length = 120
target-version = "py312"

[lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, annotations
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[lint.isort]
known-first-party = ["fx", "ingest", "server", "tests", "main"]

[lint.per-file-ignores]
# Test doubles mimic SDK methods that take arbitrary keyword arguments.
"**/tests/*" = ["ANN401"]
